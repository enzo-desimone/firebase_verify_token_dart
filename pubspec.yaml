name: firebase_verify_token_dart
description: A highly performant Dart package to verify and decode Firebase Auth ID tokens (JWTs) across multiple Firebase projects using Google's public keys.
version: 2.3.2
homepage: https://github.com/enzo-desimone/firebase_verify_token_dart

screenshots:
  - description: "Fast Dart and Flutter Firebase Auth ID token verification and JWT decoding using Google public certificates."
    path: example/firebase-verify-token-dart.webp

environment:
  sdk: '>=3.1.2 <4.0.0'

dependencies:
  http: ^1.6.0
  intl: ^0.20.3
  jose_plus: ^1.0.0
  ntp_dart: ^1.3.2


dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.32.0


